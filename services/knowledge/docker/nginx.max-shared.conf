server {
    listen 80;
    server_name _;
    client_max_body_size 8k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    set $vedomo_backend http://backend:8000;

    location = /api/integrations/prodigy/chat {
        if ($request_method != POST) {
            return 404;
        }

        proxy_pass $vedomo_backend;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/integrations/prodigy/documents/import {
        if ($request_method != POST) {
            return 404;
        }
        client_max_body_size 64k;
        proxy_pass $vedomo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ "^/api/integrations/prodigy/documents/([A-Za-z0-9-]+|by-hash/[a-f0-9]{64})$" {
        if ($request_method != GET) {
            return 404;
        }

        proxy_pass $vedomo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 404;
    }
}

# Synthetic storage drill only. No host ports and no production volumes.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drill
      POSTGRES_PASSWORD: synthetic-only
      POSTGRES_DB: drill
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U drill -d drill"]
      interval: 2s
      retries: 20
  backend:
    # Uses storage libraries only, not this image's historical application code.
    image: vedomo-pro-backend:latest
    entrypoint: [python, -c]
    command: ["import signal,time,sys; signal.signal(signal.SIGTERM, lambda *_: sys.exit(0)); time.sleep(86400)"]
    environment:
      ANONYMIZED_TELEMETRY: 'false'
    volumes:
      - docs:/app/docs
      - data:/app/data
      - ./restore_drill_data.py:/drill.py:ro
    depends_on:
      db:
        condition: service_healthy
volumes:
  pg:
  docs:
  data:

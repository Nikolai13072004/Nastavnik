worker_processes 1;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 768k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server {
        listen 8443 ssl;
        ssl_certificate /run/tls/cert.pem;
        ssl_certificate_key /run/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        set $prodigy_gateway http://gateway:8080;
        set $vedomo_api http://vedomo-api:8000;
        location /api/integrations/prodigy/ {
            proxy_pass $vedomo_api;
            proxy_read_timeout 115s;
        }
        location / {
            proxy_pass $prodigy_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 115s;
        }
    }
}

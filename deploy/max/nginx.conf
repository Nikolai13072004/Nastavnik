worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }

http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;

    # All requests arrive through Traefik; these are intentionally aggregate pilot limits.
    limit_req_zone $binary_remote_addr zone=api:1m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=page:1m rate=20r/s;
    limit_req_status 429;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 10s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    # The gateway supplies one nosniff header, including upstream errors.
    proxy_hide_header X-Content-Type-Options;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    server {
        listen 8080;
        # Resolve Docker's web service again after a container update.
        set $prodigy_backend http://web:3000;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;

        location = / { return 302 /max; }
        location = /max {
            limit_except GET { deny all; }
            limit_req zone=page burst=20 nodelay;
            proxy_pass $prodigy_backend;
        }
        location = /api/max/documents {
            client_max_body_size 768k;
            limit_except GET POST PUT { deny all; }
            limit_req zone=api burst=10 nodelay;
            proxy_pass $prodigy_backend;
        }
        location = /api/max/knowledge {
            limit_except POST { deny all; }
            limit_req zone=api burst=10 nodelay;
            proxy_read_timeout 115s;
            proxy_pass $prodigy_backend;
        }
        location = /api/max/documents/knowledge {
            limit_except POST { deny all; }
            limit_req zone=api burst=10 nodelay;
            proxy_pass $prodigy_backend;
        }
        location ~ ^/api/max/(identity|courses|course|course-search|quiz|manager-report|employees|documents|document-training|webhook)$ {
            limit_except GET POST PUT { deny all; }
            limit_req zone=api burst=10 nodelay;
            proxy_pass $prodigy_backend;
        }
        location /_next/static/ {
            limit_except GET { deny all; }
            limit_req zone=page burst=60 nodelay;
            proxy_pass $prodigy_backend;
        }
        location = /favicon.ico {
            limit_except GET { deny all; }
            proxy_pass $prodigy_backend;
        }
        # No LMS admin, login, uploads, image optimizer or general API exposure.
        location / { return 404; }
    }
}
